name: Daily Division I preview snapshot

on:
  schedule:
    - cron: '30 6 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily-division-i-preview.yml'
      - 'scripts/build_division_i_snapshot.py'
      - 'scripts/probe_hoopr_division_i.R'

permissions:
  contents: read

concurrency:
  group: division-i-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download, validate, and build the snapshot
        run: python scripts/build_division_i_snapshot.py --season 2027
      - name: Keep the raw Torvik inputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: division-i-2027-raw
          path: data/raw/division_i/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: division-i-2027-preview
          path: data/current/division-i-2027.csv
          if-no-files-found: error

  hoopr-hosted-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: sportsdataverse/hoopR
      - name: Fetch both BartTorvik feeds
        run: Rscript scripts/probe_hoopr_division_i.R "$RUNNER_TEMP/hoopr-probe"
      - name: Validate and join the downloaded data
        run: >-
          python3 scripts/build_division_i_snapshot.py --season 2027
          --players "$RUNNER_TEMP/hoopr-probe/players.csv"
          --shooting "$RUNNER_TEMP/hoopr-probe/shooting.json"
          --output "$RUNNER_TEMP/hoopr-probe/current.csv"
